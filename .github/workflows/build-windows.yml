name: Release Windows Desktop

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Impuls Windows Release
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract Release Notes from CHANGELOG.md
        id: extract_notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          echo "Extracting notes for version ${VERSION}..."
          awk -v ver="${VERSION}" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && /^## / { exit }
            flag { print }
          ' CHANGELOG.md > release_notes.txt

          if [ ! -s release_notes.txt ]; then
            echo "Release ${VERSION} of Impuls Windows Desktop" > release_notes.txt
          fi

      - name: Download & Build Impuls Executable
        shell: pwsh
        run: |
          Write-Host "Downloading upstream base package..."
          curl.exe -L -o tportable.zip https://telegram.org/dl/desktop/win64_portable
          
          Write-Host "Extracting portable package..."
          tar -xf tportable.zip
          
          Write-Host "Applying Impuls DC endpoints (80.201.130.248:20443) and RSA keys..."
          node tools/patch_impuls_binary.js Telegram/Telegram.exe Telegram/Impuls.exe
          
          Write-Host "Compiling icon changer..."
          C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe /out:ChangeIcon.exe tools/ChangeIcon.cs
          
          Write-Host "Injecting Impuls kinetic icon into executable resources..."
          .\ChangeIcon.exe Telegram/Impuls.exe Telegram/Resources/art/icon256.ico
          
          Write-Host "Cleaning up unpatched binaries..."
          Remove-Item Telegram/Telegram.exe -Force

      - name: Package Release Distribution
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME
          New-Item -ItemType Directory -Path "dist" -Force
          Copy-Item "tools/README.txt" "Telegram/README.txt" -Force
          
          Write-Host "Creating portable zip archive..."
          Compress-Archive -Path "Telegram\*" -DestinationPath "dist\Impuls-$ver-Windows-x64.zip"
          
          Write-Host "Copying standalone Impuls.exe..."
          Copy-Item "Telegram\Impuls.exe" -Destination "dist\Impuls.exe"
          
          Write-Host "Packaging assets..."
          Compress-Archive -Path "Telegram\Resources\art\icon256.ico", "Telegram\Resources\art\icon256.png", "Telegram\build\version", "CHANGELOG.md" -DestinationPath "dist\Impuls-Desktop-$ver-Assets.zip"
          
          Get-ChildItem "dist"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Impuls Windows Desktop ${{ github.ref_name }}
          body_path: release_notes.txt
          files: |
            dist/*.zip
            dist/Impuls.exe
          draft: false
          prerelease: false
